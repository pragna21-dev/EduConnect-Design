<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduConnect</title>
    <!-- Tailwind CSS CLI generated file -->
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body class="bg-slate-50 text-slate-800">
    <header class="bg-white border-b border-slate-200">
      <nav class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-4 sm:px-6 lg:px-8">
        <!-- Logo -->
        <a href="#" class="flex items-center gap-2 shrink-0">
          <img src="./images/graduation-cap.svg" alt="EduConnect Logo" class="h-10 w-10 object-contain" />
          <span class="text-2xl text-blue-950 font-bold">Educonnect</span>
        </a>
        <!-- Navigation Links -->
        <ul class="hidden lg:flex items-center gap-5 lg:gap-7">
          <li><a href="#" class="text-indigo-600 font-semibold"> Home</a></li>
          <li><a href="#courses" class="text-slate-600 font-medium transition hover:text-indigo-600">Courses</a></li>
          <li><a href="#instructors" class="text-slate-600 font-medium transition hover:text-indigo-600">Instructors</a></li>
          <li><a href="#reviews" class="text-slate-600 font-medium transition hover:text-indigo-600">Reviews</a></li>
        </ul>
        <!-- Search Field: Desktop -->
        <div class="hidden flex-1 md:block md:max-w-48 lg:max-w-52 xl:max-w-64">
          <input type="search" placeholder="Search courses..." aria-label="Search courses" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
        </div>
        <!-- Search Icon: Mobile and Tablet -->
        <a href="#courses" aria-label="Explore courses" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-6 w-6">
            <circle cx="11" cy="11" r="7" />
            <path stroke-linecap="round" d="m16 16 4 4" />
          </svg>
        </a>
        <!-- Login and Sign Up -->
        <div class="flex shrink-0 items-center gap-1 sm:gap-3">
          <a href="#login" class="rounded-lg px-2 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-indigo-600 sm:px-3 sm:text-base">Login</a>
          <a href="#signup" class="rounded-lg bg-indigo-600 px-3 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 sm:px-4 sm:text-base"> Sign Up </a>
        </div>
      </nav>
    </header>
  </body>
</html>
