<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>
  <body>
    <header class="bg-white border-b border-slate-200">
      <nav class="mx-auto flex max-w-7xl items-center justify-between gap-3 p-3">
        <!-- Logo -->
        <a href="index.html" class="flex items-center gap-2">
          <img src="./images/graduation-cap.svg" alt="EduConnect Logo" class="h-10 w-10 object-contain" />
          <span class="text-2xl text-blue-950 font-bold">Educonnect</span>
        </a>

        <!-- Login-->
        <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-3">
          <p class="text-sm text-slate-400 hidden md:flex">Already have an Account?</p>
          <a href="#login" class="rounded-lg px-2 py-2 text-lg font-semibold text-indigo-600 hover:bg-slate-100">Login</a>
        </div>
      </nav>
    </header>

    <main class="bg-slate-50">
      <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white w-full rounded-xl p-8 shadow-lg max-w-3xl">
          <!-- Logo -->
          <div class="flex flex-col items-center gap-0 mb-5">
            <a href="#">
              <i class="fa-solid fa-graduation-cap text-indigo-600 text-2xl"></i>
            </a>
            <h2 class="text-2xl font-bold">Create Your Account</h2>
            <p class="text-xs text-slate-400">Start your learning journey with Educonnect</p>
          </div>
          <!-- form start -->
          <form>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <fieldset class="border border-gray-300 rounded p-4">
                <legend class="text-indigo-700 text-lg font-semibold">Personal Information</legend>
                <div class="flex flex-col gap-1">
                  <label for="fullName" class="text-sm font-medium text-slate-700"> Full Name <span class="text-red-700">*</span> </label>
                  <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required class="text-sm w-full rounded-lg border border-slate-300 p-2 outline-none focus:border-indigo-500" />
                </div>
                <div class="flex flex-col gap-1">
                  <label for="dob" class="text-sm font-medium text-slate-700"> Date of Birth </label>
                  <input type="date" id="dob" name="Date Of Birth" class="text-sm w-full rounded-lg border border-slate-300 p-2 outline-none focus:border-indigo-500" />
                </div>
                <div class="flex flex-col gap-1">
                  <label for="phone" class="text-slate-700 text-sm font-medium">Phone Number<span class="text-red-700">*</span></label>
                  <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" class="text-sm w-full rounded-lg border border-slate-300 p-2 outline-none focus:border-indigo-500" />
                </div>
              </fieldset>
              <fieldset class="border border-gray-300 rounded p-4">
                <legend class="text-indigo-700 text-lg font-semibold">Account Information</legend>

                <div class="flex flex-col gap-1">
                  <label for="email" class="text-slate-700 text-sm font-medium">Email <span class="text-red-700">*</span></label>
                  <input type="email" id="email" name="email" placeholder="Enter your Email address" required class="text-sm w-full rounded-lg border border-slate-300 p-2 outline-none focus:border-indigo-500" />
                </div>
                <div class="flex flex-col gap-1">
                  <label for="password" class="text-sm font-medium text-slate-700">Password<span class="text-red-700">*</span></label>
                  <input type="password" id="password" name="password" placeholder="Create Password" required minlength="8" class="text-sm w-full rounded-lg border border-slate-300 p-2 outline-none hover:border-indigo-500" />
                </div>
                <div class="flex flex-col gap-1">
                  <label for="confirm-password" class="text-sm font-medium text-slate-700">Confirm Password<span class="text-red-700">*</span></label>
                  <input type="password" id="confirm-password" name="confirm password" placeholder="Confirm your Password" required minlength="8" class="text-sm w-full rounded-lg border border-slate-300 p-2 outline-none hover:border-indigo-500" />
                </div>
              </fieldset>

              <div class="flex flex-col gap-1">
                <label for="education" class="text-slate-700 text-sm font-medium">Education Leval<span class="text-red-700">*</span></label>
                <select id="education" name="education" required class="text-sm w-full rounded-lg border border-slate-300 bg-white p-2 outline-none hover:border-indigo-500">
                  <option value="">Select Education Leval</option>
                  <option value="hsc">HSC</option>
                  <option value="graduate">Graduate</option>
                  <option value="bca">BCA</option>
                  <option value="mca">MCA</option>
                </select>
              </div>
              <div class="flex flex-col gap-1">
                <label for="course" class="text-slate-700 text-sm font-medium">Course Selection<span class="text-red-700">*</span></label>
                <select id="course" name="course" required class="text-sm w-full rounded-lg border border-slate-300 bg-white p-2 outline-none hover:border-indigo-500">
                  <option value="">Select Course</option>
                  <option value="hsc">Web Develope</option>
                  <option value="digital marketing">Digital Marketing</option>
                  <option value="health">Health</option>
                  <option value="testing">Testing</option>
                </select>
              </div>
            </div>
            <div class="flex items-center justify-start gap-1 py-2">
              <input type="checkbox" class="h-4 w-4 accent-indigo-600" />
              <p class="px-1 text-slate-600 text-sm">I agree to the <span class="text-indigo-600 font-semibold"> Terms and Conditions </span></p>
            </div>
            <div class="flex justify-center items-center gap-2 mt-2">
              <button type="submit" class="w-56 bg-indigo-600 hover:bg-indigo-800 text-white p-2 rounded-lg text-sm font-semibold">Create Account -></button>
              <button type="reset" class="w-28 bg-white text-indigo-600 border border-indigo-600 p-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 hover:text-white">Reset</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
